version: "3.9"

services:
  ullu-api:
    build:
      context: ./api
    image: ullu-api
    container_name: ullu-api
    ports:
      - "9150:9150"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=200
      - LOG_LEVEL=info
    volumes:
      - rag_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9150/health"]
      interval: 10s
      timeout: 3s
      retries: 15

  ullu-ui:
    build:
      context: ./ui
    image: ullu-ui
    container_name: ullu-ui
    ports:
      - "9151:9151"
    environment:
      - NO_PROXY=127.0.0.1,localhost
      - no_proxy=127.0.0.1,localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ullu-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9151/health"]
      interval: 10s
      timeout: 3s
      retries: 15

volumes:
  rag_data:

