services:
  ollama:
    image: dustynv/ollama:r36.4.0
    container_name: ollama
    restart: unless-stopped

    # Publish the Ollama HTTP API
    ports:
      - "11434:11434"

    # This image expects host/port via env, not a --host flag
    environment:
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_LOGS: /data/logs/ollama.log

    # Keep ALL data on the SSD
    volumes:
      - /ssd/ollama/models:/models
      - /ssd/ollama/data:/root/.ollama
      - /ssd/ollama/logs:/data/logs

    # Make the server the long-lived foreground process (PID 1)
    entrypoint: ["/bin/bash","-lc","exec ollama serve"]

    # Enable GPU access on Jetson (works with NVIDIA Container Toolkit)
    runtime: nvidia

    dns:
      - 1.1.1.1
      - 8.8.8.8
    runtime: nvidia
